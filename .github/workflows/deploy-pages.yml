name: Deploy Mini App to GitHub Pages

on:
  push:
    # Рабочие ветки тоже публикуются: сайт Pages у репозитория один,
    # поэтому последний запуск (из main или из ветки) и есть то, что онлайн.
    branches: [main, "arena/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Repository → Settings → Secrets and variables → Actions → Variables.
          # VITE_GAME_SERVER: wss://your-server.example.com  (online play)
          # VITE_BOT_APP_URL: https://t.me/your_bot/your_app (invite links)
          VITE_GAME_SERVER: ${{ vars.VITE_GAME_SERVER }}
          VITE_BOT_APP_URL: ${{ vars.VITE_BOT_APP_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
